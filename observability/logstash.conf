input { beats { port => 5044 } }

filter {
  mutate { add_field => { "[event][dataset]" => "%{[data_stream][dataset]}" } }
  if [data_stream][dataset] == "access" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
      ecs_compatibility => "v8"
      tag_on_failure => ["access_parse_failure"]
    }
    date { match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"] remove_field => ["timestamp"] }
    mutate {
      rename => { "[source][address]" => "[source][ip]" }
      convert => { "[http][response][status_code]" => "integer" "[http][response][body][bytes]" => "integer" }
      add_field => { "[service][name]" => "http-access" }
      remove_field => ["[user_agent][original]", "[http][request][referrer]"]
    }
    if [source][ip] {
      geoip {
        source => "[source][ip]"
        target => "[source]"
        ecs_compatibility => "v8"
      }
    }
  }
  if "access_parse_failure" in [tags] or [error][type] == "json" {
    mutate {
      replace => { "[data_stream][dataset]" => "quarantine" "[event][dataset]" => "quarantine" }
    }
  }
  mutate { remove_field => ["[agent]", "[input]", "[host]", "[ecs][version]"] }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "telemetry_ingest"
    password => "${INGEST_PASSWORD}"
    data_stream => "true"
    data_stream_auto_routing => true
    ecs_compatibility => "v8"
    manage_template => false
  }
}
