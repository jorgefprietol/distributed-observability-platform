[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv312"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=platform_app --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/junit.xml --cov-fail-under=80"

[tool.coverage.run]
omit = ["platform_app/telemetry.py"]
